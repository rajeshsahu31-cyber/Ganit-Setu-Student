<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>मेरी प्रोफाइल | गणित सेतु</title>

  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .profile-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
    }

    .profile-photo-large {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--soft);
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      overflow: hidden;
      font-size: 26px;
      font-weight: 800;
      color: var(--blue);
    }

    .profile-photo-large img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .info {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .info small {
      display: block;
      color: #687489;
      margin-bottom: 4px;
    }

    @media (max-width: 600px) {
      .profile-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="simple-header">
    <div class="brand-inline">
      <div class="logo-small">GS</div>
      <b>गणित सेतु</b>
    </div>

    <a href="home.html">← होम</a>
  </header>

  <main class="page narrow">

    <section class="profile-card">

      <div class="profile-photo-large" id="pPhoto">GS</div>

      <h1 class="center" id="pName">मेरी प्रोफाइल</h1>

      <p class="center muted">
        आप बाद में यहीं से अपनी Profile Photo Upload या Change कर सकेंगे।
      </p>

      <div class="profile-grid">

        <div class="info">
          <small>विद्यार्थी आईडी</small>
          <b id="pId">—</b>
        </div>

        <div class="info">
          <small>कक्षा</small>
          <b id="pClass">—</b>
        </div>

        <div class="info">
          <small>विद्यालय</small>
          <b id="pSchool">—</b>
        </div>

        <div class="info">
          <small>मोबाइल</small>
          <b id="pMobile">—</b>
        </div>

      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="assets/js/supabase.js"></script>

  <script src="assets/js/profile-page.js"></script>

</body>
</html>
