<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganit Setu | रजिस्ट्रेशन</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
.uppercase-field { text-transform: uppercase; }
#mobile, #schoolDiseCode, #studentPassword { letter-spacing: .5px; }
</style>
</head>
<body>
<header class="simple-header"><a href="index.html">← वापस</a><div class="mini-brand">GS गणित सेतु</div></header>
<main class="page narrow">
<section class="panel">
<h1>विद्यार्थी रजिस्ट्रेशन</h1>
<p class="muted">नीचे दी गई आवश्यक जानकारी भरें</p>
<form id="registrationForm" class="registration-grid">
<div><label>विद्यार्थी का नाम</label><input id="fullName" class="uppercase-field" required placeholder="पूरा नाम" autocomplete="name"></div>
<div><label>कक्षा</label><select id="classLevel" required><option value="">कक्षा चुनें</option><option value="9">कक्षा 9</option><option value="10">कक्षा 10</option></select></div>
<div><label>विद्यालय का नाम</label><input id="schoolName" class="uppercase-field" required placeholder="विद्यालय का नाम"></div>
<div><label>UDISE / DISE कोड</label><input id="schoolDiseCode" required inputmode="numeric" maxlength="11" pattern="[0-9]{11}" placeholder="11 अंकों का UDISE / DISE कोड"></div>
<div><label>गाँव / शहर</label><input id="villageCity" class="uppercase-field" required placeholder="गाँव या शहर"></div>
<div><label>ब्लॉक</label><input id="block" class="uppercase-field" required placeholder="ब्लॉक"></div>
<div><label>जिला</label><input id="district" class="uppercase-field" required placeholder="जिला"></div>
<div><label>राज्य</label><input id="state" class="uppercase-field" value="MADHYA PRADESH" required readonly></div>
<div><label>मोबाइल नंबर</label><input id="mobile" type="text" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" required placeholder="10 अंकों का मोबाइल नंबर" autocomplete="tel"></div>
<div><label>6 अंकों का पासवर्ड बनाएं</label>
<input id="studentPassword" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required placeholder="केवल 6 अंक" autocomplete="new-password">
<small class="muted">अपना आसान 6 अंकों का पासवर्ड स्वयं बनाएं। उदाहरण: 123456</small></div>
<button id="registerBtn" class="primary-btn full" type="submit">रजिस्ट्रेशन पूरा करें</button>
</form>
<div id="registrationResult"></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/app.js"></script>
</body></html>
