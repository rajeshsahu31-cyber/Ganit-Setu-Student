<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>पिछला परिणाम जानें - गणित सेतु</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
:root{--blue:#1268d6;--blue2:#eaf3ff;--text:#18324d;--muted:#6c7d90;--border:#dbe7f4}
body{margin:0;background:#f5f9ff;color:var(--text);font-family:Arial,"Noto Sans Devanagari",sans-serif;padding-bottom:88px}
.pr-wrap{max-width:720px;margin:0 auto;padding:16px}
.pr-head{background:linear-gradient(135deg,#1268d6,#2486e8);color:#fff;border-radius:18px;padding:20px 18px;box-shadow:0 8px 22px rgba(18,104,214,.16)}
.pr-head h1{font-size:22px;margin:0 0 6px}.pr-head p{margin:0;font-size:13px;opacity:.94}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 5px 18px rgba(20,60,100,.06)}
.label{font-size:13px;font-weight:700;margin-bottom:8px;display:block}
input[type=date],select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbdbea;border-radius:11px;font-size:15px;background:#fff;color:var(--text)}
.demo-note{background:var(--blue2);border:1px solid #cfe2fb;border-radius:12px;padding:12px;font-size:12px;line-height:1.55;color:#315a83}
.attempt{border:1px solid var(--border);border-radius:13px;padding:13px;margin-top:10px}
.attempt-top{display:flex;justify-content:space-between;gap:10px}.attempt-title{font-weight:800;font-size:15px}.score{font-weight:800;color:var(--blue);white-space:nowrap}
.meta{font-size:12px;color:var(--muted);margin-top:5px}.review-btn{margin-top:10px;border:0;background:var(--blue);color:#fff;border-radius:9px;padding:9px 13px;font-weight:700}
.review{display:none}.review.show{display:block}.q{border:1px solid var(--border);border-radius:13px;padding:13px;margin-top:10px}.qno{font-size:12px;color:var(--blue);font-weight:800}.qtext{font-weight:700;margin:6px 0 10px;line-height:1.5}.ans{font-size:12px;padding:8px;border-radius:8px;margin-top:6px}.wrong{background:#fff1f1;color:#a33}.correct{background:#edf9f0;color:#24743a}
.empty{text-align:center;color:var(--muted);padding:18px;font-size:13px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:999;background:#fff;border-top:1px solid #dce7f2;box-shadow:0 -5px 18px rgba(20,60,100,.08);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.bottom-nav a{text-decoration:none;color:#647487;text-align:center;font-size:11px;font-weight:700;padding:5px 2px;border-radius:11px;min-width:0}
.bottom-nav a span{display:block;font-size:21px;line-height:23px;margin-bottom:2px}.bottom-nav a.active{color:var(--blue);background:#eef5ff}
@media(max-width:380px){.pr-wrap{padding:12px}.pr-head h1{font-size:20px}.bottom-nav a{font-size:10px}.bottom-nav a span{font-size:19px}}
</style>
</head>
<body>
<main class="pr-wrap">
<section class="pr-head">
<h1>📋 पिछला परिणाम जानें</h1>
<p>अपनी पुरानी परीक्षा का रिकॉर्ड तारीख के अनुसार देखें</p>
</section>

<section class="card">
<label class="label" for="date">📅 तारीख चुनें</label>
<input id="date" type="date">
<div class="demo-note" style="margin-top:10px">एक समय में केवल चुनी हुई तारीख का वास्तविक Supabase रिकॉर्ड दिखेगा। सभी पुराने attempts database में सुरक्षित रहेंगे।</div>
</section>

<section class="card">
<label class="label">📝 इस तारीख के Test</label>
<div id="attempts"></div>
</section>

<section id="review" class="card review">
<label class="label">🔎 प्रश्नपत्र Review</label>
<div id="reviewMeta" class="demo-note"></div>
<div id="questions"></div>
</section>
</main>

<nav class="bottom-nav">
<a href="home.html"><span>🏠</span>होम</a>
<a href="leaderboard.html"><span>🏆</span>रैंकिंग</a>
<a href="pragati.html"><span>📈</span>प्रगति</a>
<a href="profile.html"><span>👤</span>प्रोफाइल</a>
</nav>

<script src="assets/js/supabase.js"></script>
<script>
'use strict';

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
}[c]));

function studentCode(){
  return sessionStorage.getItem('ganit_setu_student_id') ||
         localStorage.getItem('studentCode') ||
         localStorage.getItem('studentId') || '';
}

function indiaToday(){
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone:'Asia/Kolkata', year:'numeric', month:'2-digit', day:'2-digit'
  }).formatToParts(new Date());
  const o={}; parts.forEach(x=>o[x.type]=x.value);
  return `${o.year}-${o.month}-${o.day}`;
}

function nextDate(iso){
  const d = new Date(`${iso}T00:00:00+05:30`);
  d.setDate(d.getDate()+1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDMY(iso){
  if(!iso) return '—';
  const [y,m,d]=iso.split('-');
  return `${d}/${m}/${y}`;
}

function testLabel(t){
  const map={course_progress:'कोर्स टेस्ट',chapter_practice:'अध्याय टेस्ट',daily:'Daily Test'};
  return t?.title || map[t?.test_type] || 'टेस्ट';
}

function duration(sec){
  sec=Number(sec||0);
  const m=Math.floor(sec/60), s=sec%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

let currentRows=[];

function resetReview(){
  document.getElementById('review').classList.remove('show');
  document.getElementById('questions').innerHTML='';
  document.getElementById('reviewMeta').innerHTML='';
}

async function getStudent(){
  const code=studentCode();
  if(!code) throw new Error('कृपया पहले Student Login करें।');

  const {data,error}=await supabaseClient
    .from('students')
    .select('id,student_id,class_level,full_name')
    .eq('student_id',code)
    .maybeSingle();

  if(error) throw error;
  if(!data?.id) throw new Error('विद्यार्थी का database record नहीं मिला।');
  return data;
}

async function loadAttempts(){
  const date=document.getElementById('date').value;
  const box=document.getElementById('attempts');
  resetReview();
  currentRows=[];

  if(!date){
    box.innerHTML='<div class="empty">कृपया तारीख चुनें।</div>';
    return;
  }

  box.innerHTML='<div class="empty">☁️ Supabase से परिणाम लोड हो रहा है...</div>';

  try{
    const student=await getStudent();
    const from=`${date}T00:00:00+05:30`;
    const to=`${nextDate(date)}T00:00:00+05:30`;

    const {data,error}=await supabaseClient
      .from('test_attempts')
      .select(`id,status,submitted_at,test_id,tests(id,title,test_type,class_level,chapter_from,chapter_to)`)
      .eq('student_id',student.id)
      .eq('status','submitted')
      .gte('submitted_at',from)
      .lt('submitted_at',to)
      .order('submitted_at',{ascending:false});

    if(error) throw error;

    const rows=(data||[]).filter(r=>
      r.tests && Number(r.tests.class_level)===Number(student.class_level)
    );

    if(!rows.length){
      box.innerHTML=`<div class="empty">${formatDMY(date)} को कोई test record नहीं मिला।</div>`;
      return;
    }

    currentRows=rows;

    const enriched=await Promise.all(rows.map(async r=>{
      const [qRes,aRes]=await Promise.all([
        supabaseClient.from('test_questions').select('question_id,question_order,marks').eq('test_id',r.test_id).order('question_order',{ascending:true}),
        supabaseClient.from('student_answers').select('question_id,is_correct').eq('student_id',student.id).eq('test_id',r.test_id)
      ]);
      if(qRes.error) throw qRes.error;
      if(aRes.error) throw aRes.error;
      const total=(qRes.data||[]).length;
      const correct=(aRes.data||[]).filter(x=>x.is_correct===true).length;
      const attempted=(aRes.data||[]).length;
      const wrong=(aRes.data||[]).filter(x=>x.is_correct===false).length;
      const unattempted=Math.max(0,total-attempted);
      const score=correct;
      const percentage=total ? (correct/total)*100 : 0;
      return {...r,_total:total,_correct:correct,_wrong:wrong,_unattempted:unattempted,_score:score,_percentage:percentage};
    }));

    currentRows=enriched;

    box.innerHTML=enriched.map((r,i)=>`
      <div class="attempt">
        <div class="attempt-top">
          <div class="attempt-title">${esc(testLabel(r.tests))}</div>
          <div class="score">${r._score}/${r._total}</div>
        </div>
        <div class="meta">
          सही ${r._correct} • गलत ${r._wrong} • छोड़े ${r._unattempted} • ${r._percentage.toFixed(1)}%
          ${r.submitted_at ? ' • '+esc(new Date(r.submitted_at).toLocaleTimeString('hi-IN',{hour:'2-digit',minute:'2-digit'})) : ''}
        </div>
        <button class="review-btn" onclick="openReview(${i})">प्रश्नपत्र Review करें</button>
      </div>`).join('');

  }catch(err){
    console.error('Previous Result Supabase Error:',err);
    box.innerHTML=`<div class="empty" style="color:#a33">❌ Result load नहीं हो सका।<br><small>${esc(err.message||err)}</small></div>`;
  }
}

async function openReview(index){
  const r=currentRows[index];
  if(!r) return;

  const review=document.getElementById('review');
  const qbox=document.getElementById('questions');
  qbox.innerHTML='<div class="empty">☁️ प्रश्नपत्र लोड हो रहा है...</div>';
  review.classList.add('show');
  review.scrollIntoView({behavior:'smooth',block:'start'});

  try{
    const student=await getStudent();

    const [tqRes,ansRes]=await Promise.all([
      supabaseClient.from('test_questions').select('question_id,question_order,marks').eq('test_id',r.test_id).order('question_order',{ascending:true}),
      supabaseClient.from('student_answers').select('question_id,selected_option,is_correct,time_taken_seconds').eq('student_id',student.id).eq('test_id',r.test_id)
    ]);
    if(tqRes.error) throw tqRes.error;
    if(ansRes.error) throw ansRes.error;

    const tq=tqRes.data||[];
    const answers=new Map((ansRes.data||[]).map(a=>[String(a.question_id),a]));
    const ids=tq.map(x=>x.question_id);

    let questions=[];
    if(ids.length){
      const qRes=await supabaseClient
        .from('questions')
        .select('id,question_text,option_a,option_b,option_c,option_d,correct_option,chapter_number,chapter_name')
        .in('id',ids);
      if(qRes.error) throw qRes.error;
      const byId=new Map((qRes.data||[]).map(q=>[String(q.id),q]));
      questions=tq.map(x=>byId.get(String(x.question_id))).filter(Boolean);
    }

    document.getElementById('reviewMeta').innerHTML=`
      <b>${esc(testLabel(r.tests))}</b><br>
      तारीख: ${formatDMY(document.getElementById('date').value)} &nbsp; | &nbsp;
      अंक: <b>${r._score}/${r._total}</b> &nbsp; | &nbsp;
      सही: ${r._correct} • गलत: ${r._wrong} • छोड़े: ${r._unattempted}
    `;

    if(!questions.length){
      qbox.innerHTML='<div class="empty">इस attempt का प्रश्नपत्र उपलब्ध नहीं है।</div>';
      return;
    }

    qbox.innerHTML=questions.map((q,i)=>{
      const a=answers.get(String(q.id));
      const selected=a?.selected_option;
      const isCorrect=a?.is_correct===true;
      const attempted=selected!==null && selected!==undefined && String(selected).trim()!=='';
      const statusClass=isCorrect?'correct':'wrong';
      const statusText=isCorrect?'सही उत्तर':'गलत / छोड़ा गया';
      const your=attempted ? selected : 'उत्तर नहीं दिया';
      const options=[['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].filter(x=>x[1]!==null && x[1]!==undefined && String(x[1]).trim()!=='');
      return `<div class="q">
        <div class="qno">प्रश्न ${i+1}${q.chapter_name ? ' • '+esc(q.chapter_name) : ''}</div>
        <div class="qtext">${esc(q.question_text)}</div>
        ${options.length ? `<div class="meta" style="margin:6px 0">${options.map(x=>`<div><b>${x[0]}.</b> ${esc(x[1])}</div>`).join('')}</div>`:''}
        <div class="ans ${statusClass}">आपका उत्तर: ${isCorrect?'✅':'❌'} ${esc(your)} — ${esc(statusText)}</div>
        <div class="ans correct">सही उत्तर: ✅ ${esc(q.correct_option)}</div>
      </div>`;
    }).join('');
  }catch(err){
    console.error('Review Supabase Error:',err);
    qbox.innerHTML=`<div class="empty" style="color:#a33">❌ प्रश्नपत्र Review नहीं हो सका।<br><small>${esc(err.message||err)}</small></div>`;
  }
}

const dateInput=document.getElementById('date');
dateInput.addEventListener('change',loadAttempts);
dateInput.value=indiaToday();
loadAttempts();
</script>
</body>
</html>
