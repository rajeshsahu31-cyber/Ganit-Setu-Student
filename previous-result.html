<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>पिछला परिणाम जानें - गणित सेतु</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
:root{--blue:#1268d6;--blue2:#eaf3ff;--text:#18324d;--muted:#6c7d90;--border:#dbe7f4}
body{margin:0;background:#f5f9ff;color:var(--text);font-family:Arial,"Noto Sans Devanagari",sans-serif;padding-bottom:88px}
.pr-wrap{max-width:720px;margin:0 auto;padding:16px}
.pr-head{background:linear-gradient(135deg,#1268d6,#2486e8);color:#fff;border-radius:18px;padding:20px 18px;box-shadow:0 8px 22px rgba(18,104,214,.16)}
.pr-head h1{font-size:22px;margin:0 0 6px}.pr-head p{margin:0;font-size:13px;opacity:.94}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 5px 18px rgba(20,60,100,.06)}
.label{font-size:13px;font-weight:700;margin-bottom:8px;display:block}
input[type=date],select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbdbea;border-radius:11px;font-size:15px;background:#fff;color:var(--text)}
.date-row{display:grid;grid-template-columns:1fr 48px;gap:8px;position:relative}.date-row input[type=text]{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbdbea;border-radius:11px;font-size:18px;background:#fff;color:var(--text);letter-spacing:.5px}.date-row button{border:1px solid #cbdbea;background:#eef5ff;border-radius:11px;font-size:20px}.date-row input[type=date]{position:absolute;right:56px;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.demo-note{background:var(--blue2);border:1px solid #cfe2fb;border-radius:12px;padding:12px;font-size:12px;line-height:1.55;color:#315a83}
.attempt{border:1px solid var(--border);border-radius:13px;padding:13px;margin-top:10px}.test-select-wrap{margin-top:10px}.test-select-wrap select{font-size:16px;font-weight:700;padding:13px 12px}.selected-test{margin-top:12px}
.attempt-top{display:flex;justify-content:space-between;gap:10px}.attempt-title{font-weight:800;font-size:15px}.score{font-weight:800;color:var(--blue);white-space:nowrap}
.meta{font-size:12px;color:var(--muted);margin-top:5px}.review-btn{margin-top:10px;border:0;background:var(--blue);color:#fff;border-radius:9px;padding:9px 13px;font-weight:700}
.review{display:none}.review.show{display:block}.q{border:1px solid var(--border);border-radius:13px;padding:13px;margin-top:10px}.qno{font-size:12px;color:var(--blue);font-weight:800}.qtext{font-weight:700;margin:6px 0 10px;line-height:1.5}.ans{font-size:12px;padding:8px;border-radius:8px;margin-top:6px}.wrong{background:#fff1f1;color:#a33}.correct{background:#edf9f0;color:#24743a}
.empty{text-align:center;color:var(--muted);padding:18px;font-size:13px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:999;background:#fff;border-top:1px solid #dce7f2;box-shadow:0 -5px 18px rgba(20,60,100,.08);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.bottom-nav a{text-decoration:none;color:#647487;text-align:center;font-size:11px;font-weight:700;padding:5px 2px;border-radius:11px;min-width:0}
.bottom-nav a span{display:block;font-size:21px;line-height:23px;margin-bottom:2px}.bottom-nav a.active{color:var(--blue);background:#eef5ff}
@media(max-width:380px){.pr-wrap{padding:12px}.pr-head h1{font-size:20px}.bottom-nav a{font-size:10px}.bottom-nav a span{font-size:19px}}
</style>
</head>
<body>
<main class="pr-wrap">
<section class="pr-head">
<h1>📋 पिछला परिणाम जानें</h1>
<p>अपनी पुरानी परीक्षा का रिकॉर्ड तारीख के अनुसार देखें</p>
</section>

<section class="card">
<label class="label" for="date">📅 तारीख चुनें</label>
<div class="date-row"><input id="dateDisplay" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" maxlength="10" autocomplete="off"><button type="button" id="datePick" aria-label="तारीख चुनें">📅</button><input id="date" type="date" aria-hidden="true" tabindex="-1"></div>
<div class="demo-note" style="margin-top:10px">एक समय में केवल चुनी हुई तारीख का रिकॉर्ड दिखेगा। सभी पुराने attempts database में सुरक्षित रहेंगे।</div>
</section>

<section class="card">
<label class="label">📝 इस तारीख के Test</label>
<div id="attempts"></div>
</section>

<section id="review" class="card review">
<label class="label">🔎 प्रश्नपत्र Review</label>
<div id="reviewMeta" class="demo-note"></div>
<div id="questions"></div>
</section>
</main>

<nav class="bottom-nav">
<a href="home.html"><span>🏠</span>होम</a>
<a href="leaderboard.html"><span>🏆</span>रैंकिंग</a>
<a href="pragati.html"><span>📈</span>प्रगति</a>
<a href="profile.html"><span>👤</span>प्रोफाइल</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
<script>
'use strict';

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

function getDB(){
  if(window.supabaseClient) return window.supabaseClient;
  if(typeof supabaseClient !== 'undefined') return supabaseClient;
  return null;
}

function readSession(keys){
  for(const store of [sessionStorage,localStorage]){
    for(const key of keys){
      try{
        const v=String(store.getItem(key)||'').trim();
        if(v) return v;
      }catch(e){}
    }
  }
  return '';
}

function studentCode(){
  return readSession(['ganit_setu_student_id','studentId','studentCode','student_id']);
}

function indiaToday(){
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const o={}; parts.forEach(x=>o[x.type]=x.value);
  return `${o.year}-${o.month}-${o.day}`;
}

function nextDate(iso){
  const [y,m,d]=iso.split('-').map(Number);
  const dt=new Date(Date.UTC(y,m-1,d));
  dt.setUTCDate(dt.getUTCDate()+1);
  return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,'0')}-${String(dt.getUTCDate()).padStart(2,'0')}`;
}

function formatDMY(iso){
  if(!iso) return '—';
  const [y,m,d]=iso.split('-');
  return `${d}/${m}/${y}`;
}

function parseDMY(v){
  const m=String(v||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return '';
  const d=Number(m[1]), mo=Number(m[2]), y=Number(m[3]);
  const dt=new Date(Date.UTC(y,mo-1,d));
  if(dt.getUTCFullYear()!==y || dt.getUTCMonth()!==mo-1 || dt.getUTCDate()!==d) return '';
  return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function indiaDateOf(value){
  if(!value) return '';
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(value));
  const o={}; parts.forEach(x=>o[x.type]=x.value);
  return `${o.year}-${o.month}-${o.day}`;
}

function normalizeClass(v){
  const m=String(v??'').match(/(?:9|10)/);
  return m ? Number(m[0]) : 0;
}

function testLabel(row){
  const type=String(row?.test_type||'').toLowerCase();
  const title=String(row?.test_title||row?.title||'').trim();
  if(type==='daily') return 'Practice Test';
  if(type==='chapter_practice') return title || 'अध्याय टेस्ट';
  if(type==='course_progress') return title || 'कोर्स टेस्ट';
  if(title) return title;
  return 'टेस्ट';
}

function resetReview(){
  document.getElementById('review').classList.remove('show');
  document.getElementById('questions').innerHTML='';
  document.getElementById('reviewMeta').innerHTML='';
}

let currentRows=[];

async function getStudent(){
  const db=getDB();
  if(!db) throw new Error('Supabase connection उपलब्ध नहीं है।');
  const code=studentCode();
  if(!code) throw new Error('कृपया पहले Student Login करें।');

  /* Login का internal studentId ही authoritative है. */
  const {data,error}=await db.from('students')
    .select('id,student_id,full_name,class_level')
    .eq('student_id',code)
    .maybeSingle();
  if(error) throw error;
  if(!data?.id) throw new Error('विद्यार्थी का database record नहीं मिला।');
  return data;
}

function normalizeRpcRow(r){
  return {
    ...r,
    test_id:r.test_id || r.test_uuid || r.id_test || null,
    test_title:r.test_title || r.title || '',
    test_type:r.test_type || '',
    class_level:r.class_level,
    submitted_at:r.submitted_at || r.created_at || r.test_time || null,
    score:Number(r.score ?? r.correct_answers ?? 0),
    total_marks:Number(r.total_marks ?? r.total_questions ?? 0),
    correct_answers:Number(r.correct_answers ?? r.score ?? 0),
    percentage:Number(r.percentage ?? 0),
    time_taken_seconds:Number(r.time_taken_seconds ?? 0)
  };
}

async function loadFromResultsRPC(db, iso, student){
  const code=studentCode();
  const {data,error}=await db.rpc('get_ganit_student_results',{p_student_code:code});
  if(error) throw error;

  const cls=normalizeClass(student.class_level);
  return (Array.isArray(data)?data:[])
    .map(normalizeRpcRow)
    .filter(r=>normalizeClass(r.class_level)===cls)
    .filter(r=>indiaDateOf(r.submitted_at)===iso)
    .sort((a,b)=>new Date(b.submitted_at||0)-new Date(a.submitted_at||0));
}

async function loadFromAttemptTables(db, iso, student){
  const from=`${iso}T00:00:00+05:30`, to=`${nextDate(iso)}T00:00:00+05:30`;
  const {data:attempts,error}=await db.from('test_attempts')
    .select('id,test_id,status,submitted_at')
    .eq('student_id',student.id)
    .not('submitted_at','is',null)
    .gte('submitted_at',from).lt('submitted_at',to)
    .order('submitted_at',{ascending:false});
  if(error) throw error;
  if(!attempts?.length) return [];

  const testIds=[...new Set(attempts.map(a=>a.test_id).filter(Boolean))];
  if(!testIds.length) return [];
  const {data:tests,error:testError}=await db.from('tests')
    .select('id,title,test_type,class_level,chapter_from,chapter_to,total_questions,total_marks')
    .in('id',testIds);
  if(testError) throw testError;

  const byId=new Map((tests||[]).map(t=>[String(t.id),t]));
  return attempts.map(a=>{
    const t=byId.get(String(a.test_id));
    if(!t || normalizeClass(t.class_level)!==normalizeClass(student.class_level)) return null;
    return normalizeRpcRow({
      ...a,
      test_id:a.test_id,
      test_title:t.title,
      test_type:t.test_type,
      class_level:t.class_level,
      submitted_at:a.submitted_at,
      total_marks:t.total_marks || t.total_questions
    });
  }).filter(Boolean);
}

async function loadFromLegacyTable(db, iso, student){
  /* पुराने Student Test Records को भी support करें, क्योंकि कुछ पुराने attempts वहीं saved हैं. */
  const {data,error}=await db.from('student_test_records')
    .select('id,student_id,student_name,class_name,total_questions,correct_answers,percentage,time_taken,test_date,test_time,created_at,test_type,chapter')
    .eq('student_id',student.student_id)
    .eq('test_date',iso)
    .order('created_at',{ascending:false});
  if(error) return [];
  return (data||[]).map(r=>normalizeRpcRow({
    ...r,
    test_title:r.test_type || 'टेस्ट',
    class_level:r.class_name,
    submitted_at:r.created_at || `${r.test_date}T${r.test_time||'00:00:00'}`,
    total_marks:r.total_questions,
    score:r.correct_answers
  }));
}

function testOrder(row){
  const type=String(row?.test_type||'').toLowerCase();
  if(type==='course_progress') return 1;
  if(type==='chapter_practice') return 2;
  if(type==='daily') return 3;
  return 99;
}

function renderAttempts(rows){
  const box=document.getElementById('attempts');
  if(!rows.length){
    box.innerHTML=`<div class="empty">${formatDMY(document.getElementById('date').value)} को कोई test record नहीं मिला।</div>`;
    return;
  }

  // हमेशा वही क्रम: Course Test → Chapter Test → Practice Test
  rows.sort((a,b)=>{
    const order=testOrder(a)-testOrder(b);
    if(order!==0) return order;
    return new Date(a.submitted_at||0)-new Date(b.submitted_at||0);
  });
  currentRows=rows;

  const options=rows.map((r,i)=>`<option value="${i}">${esc(testLabel(r))}</option>`).join('');
  box.innerHTML=`
    <div class="test-select-wrap">
      <select id="testSelector" aria-label="Test चुनें">
        ${options}
      </select>
    </div>
    <div id="selectedTest" class="selected-test"></div>`;

  const selector=document.getElementById('testSelector');
  const renderSelected=()=>{
    const i=Number(selector.value);
    const r=currentRows[i];
    if(!r) return;
    const total=Number(r.total_marks||r.total_questions||0);
    const score=Number(r.score??r.correct_answers??0);
    const correct=Number(r.correct_answers??score);
    const pct=Number(r.percentage|| (total ? score/total*100 : 0));
    const time=r.time_taken_seconds ? ` • ${Math.floor(r.time_taken_seconds/60)}:${String(r.time_taken_seconds%60).padStart(2,'0')}` : '';
    const timeText=r.submitted_at ? new Intl.DateTimeFormat('hi-IN',{hour:'2-digit',minute:'2-digit'}).format(new Date(r.submitted_at)) : '';
    document.getElementById('selectedTest').innerHTML=`<div class="attempt">
      <div class="attempt-top"><div class="attempt-title">${esc(testLabel(r))}</div><div class="score">${score}/${total}</div></div>
      <div class="meta">सही ${correct} • ${pct.toFixed(1)}%${time}${timeText?' • '+esc(timeText):''}</div>
      <button class="review-btn" onclick="openReview(${i})">प्रश्नपत्र Review करें</button>
    </div>`;
  };
  selector.addEventListener('change',renderSelected);
  renderSelected();
}

async function loadAttempts(){
  const db=getDB();
  const iso=document.getElementById('date').value;
  const box=document.getElementById('attempts');
  resetReview(); currentRows=[];
  if(!iso){box.innerHTML='<div class="empty">कृपया तारीख चुनें।</div>';return;}
  if(!db){box.innerHTML='<div class="empty" style="color:#a33">❌ Supabase connection उपलब्ध नहीं है।</div>';return;}
  box.innerHTML='<div class="empty">☁️ Supabase से परिणाम लोड हो रहा है...</div>';

  try{
    const student=await getStudent();
    let rows=[];
    let rpcError=null;
    try{ rows=await loadFromResultsRPC(db,iso,student); }catch(e){ rpcError=e; console.warn('Results RPC failed:',e); }

    /* RPC खाली हो तो actual attempt tables देखें. */
    if(!rows.length){
      try{ rows=await loadFromAttemptTables(db,iso,student); }catch(e){ console.warn('Attempt table fallback failed:',e); }
    }

    /* पुराने records भी खोने नहीं हैं. */
    if(!rows.length){
      rows=await loadFromLegacyTable(db,iso,student);
    }

    currentRows=rows;
    renderAttempts(rows);

    if(!rows.length && rpcError){
      box.innerHTML=`<div class="empty">${formatDMY(iso)} को कोई test record नहीं मिला।<br><small>Supabase Result source से data उपलब्ध नहीं मिला।</small></div>`;
    }
  }catch(err){
    console.error('Previous Result Supabase Error:',err);
    box.innerHTML=`<div class="empty" style="color:#a33">❌ Result load नहीं हो सका।<br><small>${esc(err.message||err)}</small></div>`;
  }
}

async function resolveTestId(db,r,student){
  if(r.test_id) return r.test_id;
  const title=String(r.test_title||'').trim();
  const cls=normalizeClass(r.class_level||student.class_level);
  if(!title) return null;
  const {data,error}=await db.from('tests')
    .select('id,title,test_type,class_level,chapter_from,chapter_to')
    .eq('title',title)
    .eq('class_level',cls)
    .eq('test_date',document.getElementById('date').value)
    .limit(5);
  if(error) return null;
  if(!data?.length) return null;
  if(r.test_type){
    const same=data.find(t=>String(t.test_type)===String(r.test_type));
    if(same) return same.id;
  }
  return data[0].id;
}

async function openReview(index){
  const db=getDB(); const r=currentRows[index]; if(!r) return;
  const review=document.getElementById('review'), qbox=document.getElementById('questions');
  qbox.innerHTML='<div class="empty">☁️ प्रश्नपत्र लोड हो रहा है...</div>';
  review.classList.add('show'); review.scrollIntoView({behavior:'smooth',block:'start'});

  try{
    const student=await getStudent();
    const testId=await resolveTestId(db,r,student);
    if(!testId){
      document.getElementById('reviewMeta').innerHTML=`<b>${esc(testLabel(r))}</b><br>तारीख: ${formatDMY(document.getElementById('date').value)} &nbsp; | &nbsp; अंक: <b>${Number(r.score??r.correct_answers??0)}/${Number(r.total_marks??r.total_questions??0)}</b>`;
      qbox.innerHTML='<div class="empty">इस Result का test ID नहीं मिला, इसलिए प्रश्नपत्र Review उपलब्ध नहीं है।</div>';
      return;
    }

    const [tqRes,ansRes]=await Promise.all([
      db.from('test_questions').select('question_id,question_order').eq('test_id',testId).order('question_order',{ascending:true}),
      db.from('student_answers').select('question_id,selected_option,is_correct,time_taken_seconds').eq('student_id',student.id).eq('test_id',testId)
    ]);
    if(tqRes.error) throw tqRes.error;
    if(ansRes.error) throw ansRes.error;

    const tq=tqRes.data||[];
    const answers=new Map((ansRes.data||[]).map(a=>[String(a.question_id),a]));
    const ids=tq.map(x=>x.question_id);
    let questions=[];
    if(ids.length){
      const qRes=await db.from('questions').select('id,question_text,option_a,option_b,option_c,option_d,correct_option,chapter_number,chapter_name').in('id',ids);
      if(qRes.error) throw qRes.error;
      const byId=new Map((qRes.data||[]).map(q=>[String(q.id),q]));
      questions=tq.map(x=>byId.get(String(x.question_id))).filter(Boolean);
    }

    const total=Number(r.total_marks||r.total_questions||tq.length||0);
    const score=Number(r.score??r.correct_answers??0);
    document.getElementById('reviewMeta').innerHTML=`<b>${esc(testLabel(r))}</b><br>तारीख: ${formatDMY(document.getElementById('date').value)} &nbsp; | &nbsp; अंक: <b>${score}/${total}</b>`;
    if(!questions.length){qbox.innerHTML='<div class="empty">इस attempt का प्रश्नपत्र उपलब्ध नहीं है।</div>';return;}

    qbox.innerHTML=questions.map((q,i)=>{
      const a=answers.get(String(q.id));
      const attempted=a?.selected_option!==null && a?.selected_option!==undefined && String(a.selected_option).trim()!=='';
      const isCorrect=a?.is_correct===true;
      const your=attempted?a.selected_option:'उत्तर नहीं दिया';
      const options=[['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].filter(x=>x[1]!=null&&String(x[1]).trim()!=='');
      return `<div class="q"><div class="qno">प्रश्न ${i+1}${q.chapter_name?' • '+esc(q.chapter_name):''}</div><div class="qtext">${esc(q.question_text)}</div>${options.length?`<div class="meta" style="margin:6px 0">${options.map(x=>`<div><b>${x[0]}.</b> ${esc(x[1])}</div>`).join('')}</div>`:''}<div class="ans ${isCorrect?'correct':'wrong'}">आपका उत्तर: ${isCorrect?'✅':'❌'} ${esc(your)}</div><div class="ans correct">सही उत्तर: ✅ ${esc(q.correct_option)}</div></div>`;
    }).join('');
  }catch(err){
    console.error('Review Supabase Error:',err);
    qbox.innerHTML=`<div class="empty" style="color:#a33">❌ प्रश्नपत्र Review नहीं हो सका।<br><small>${esc(err.message||err)}</small></div>`;
  }
}

const dateInput=document.getElementById('date'), dateDisplay=document.getElementById('dateDisplay'), datePick=document.getElementById('datePick');
function syncDisplay(){dateDisplay.value=formatDMY(dateInput.value);}
dateDisplay.addEventListener('input',()=>{
  let v=dateDisplay.value.replace(/\D/g,'').slice(0,8);
  if(v.length>4)v=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);
  else if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);
  dateDisplay.value=v;
  const iso=parseDMY(v); if(iso){dateInput.value=iso;loadAttempts();}
});
dateDisplay.addEventListener('blur',()=>{if(dateDisplay.value&&!parseDMY(dateDisplay.value)) syncDisplay();});
datePick.addEventListener('click',()=>{try{dateInput.showPicker();}catch(e){dateInput.click();}});
dateInput.addEventListener('change',()=>{syncDisplay();loadAttempts();});
dateInput.value=indiaToday();
syncDisplay();
loadAttempts();
</script>

</body>
